<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
  <title id="title">GoldfishBench: need is not recipient suitability</title>
  <desc id="desc">A controlled routing benchmark. Approve routing only when intervention is needed and the named recipient is suitable. 662 scenario families, four domains, seven evaluated model conditions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#102A43"/><stop offset="1" stop-color="#163F50"/></linearGradient>
    <linearGradient id="fish" x1="0" x2="1"><stop stop-color="#FFB648"/><stop offset="1" stop-color="#F57B35"/></linearGradient>
  </defs>
  <rect width="1280" height="500" rx="24" fill="url(#bg)"/>
  <circle cx="1110" cy="122" r="220" fill="#E5F8F5" opacity=".03"/>
  <circle cx="1160" cy="118" r="140" fill="#E5F8F5" opacity=".04"/>
  <text x="56" y="64" font-family="Arial, sans-serif" font-size="16" letter-spacing="3" fill="#8DD6CE">CONTROLLED DECISION EVALUATION</text>
  <text x="56" y="135" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF">GoldfishBench</text>
  <text x="60" y="180" font-family="Arial, sans-serif" font-size="25" fill="#D8E9EF">Does this task need help — and can this recipient actually help?</text>
  <rect x="58" y="217" width="838" height="76" rx="12" fill="#FFFFFF" opacity=".08"/>
  <text x="83" y="265" font-family="Arial, sans-serif" font-size="25" fill="#FFFFFF">Approve routing = intervention needed</text>
  <text x="565" y="265" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#8DD6CE">AND</text>
  <text x="635" y="265" font-family="Arial, sans-serif" font-size="25" fill="#FFFFFF">recipient suitable</text>
  <g transform="translate(1010 248)">
    <path d="M-12 0 L-75-40 L-75 40 Z" fill="#F18A3C"/>
    <ellipse cx="30" cy="0" rx="73" ry="48" fill="url(#fish)"/>
    <path d="M15-38 Q35-80 56-39" fill="#FFBB5A"/>
    <path d="M12 34 Q37 69 54 37" fill="#F18A3C"/>
    <circle cx="71" cy="-11" r="8" fill="#102A43"/>
    <circle cx="74" cy="-14" r="2.5" fill="#FFFFFF"/>
    <circle cx="108" cy="-74" r="8" stroke="#8DD6CE" stroke-width="3" fill="none"/>
    <circle cx="125" cy="-109" r="5" stroke="#8DD6CE" stroke-width="2" fill="none"/>
  </g>
  <line x1="58" y1="329" x2="1222" y2="329" stroke="#FFFFFF" stroke-opacity=".18"/>
  <text x="58" y="391" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">662</text>
  <text x="58" y="421" font-family="Arial, sans-serif" font-size="18" fill="#BBD0DA">scenario families</text>
  <text x="350" y="391" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">4</text>
  <text x="350" y="421" font-family="Arial, sans-serif" font-size="18" fill="#BBD0DA">practical domains</text>
  <text x="640" y="391" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">11,136</text>
  <text x="640" y="421" font-family="Arial, sans-serif" font-size="18" fill="#BBD0DA">released questions</text>
  <text x="985" y="391" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">7</text>
  <text x="985" y="421" font-family="Arial, sans-serif" font-size="18" fill="#BBD0DA">model conditions</text>
  <text x="58" y="472" font-family="Arial, sans-serif" font-size="14" fill="#9DB9C8">Original fictional scenarios · Explicit policy-derived labels · Exploratory results · Human semantic review pending</text>
</svg>
