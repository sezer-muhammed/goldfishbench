name: Offline dataset and evaluator checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python tools/verify_release.py
      - run: python -m goldfishbench validate --output /tmp/dataset-validation.json
      - run: python tools/verify_published_results.py --output /tmp/published-results-check.json
      - run: python -m goldfishbench baseline --kind always_no --output /tmp/always-no.jsonl
      - run: python -m goldfishbench score --predictions /tmp/always-no.jsonl --output /tmp/always-no-score.json
      - name: Check the independent four-cell baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path('/tmp/dataset-validation.json').read_text())
          assert audit['items'] == 11136 and audit['independent_families'] == 662
          assert audit['questions_by_predicate'] == {'N': 1596, 'S': 1596, 'Y': 7944}
          score = json.loads(Path('/tmp/always-no-score.json').read_text())['models']['always_no']
          assert score['routing']['conditional_accuracy']['value'] == 0.75
          assert score['routing']['balanced_accuracy'] == 0.5
          assert score['all_questions']['coverage']['value'] == 1.0
          PY
