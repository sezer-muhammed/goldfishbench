[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goldfishbench"
version = "1.0.0"
description = "Offline validation and evaluation for GoldfishBench recipient suitability decisions"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Muhammed Izzet Sezer", email = "i@imsezer.com"}]
dependencies = []

[project.scripts]
goldfishbench = "goldfishbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
